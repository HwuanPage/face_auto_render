<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wirk</title>
    <link rel="stylesheet" href="fontawesome-5.5/css/all.min.css" />
    <link rel="stylesheet" href="slick/slick.css">
    <link rel="stylesheet" href="slick/slick-theme.css">
    <link rel="stylesheet" href="magnific-popup/magnific-popup.css">
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        html, body {
            color: #181a1f;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-y: auto;
        }


        .tm-hero-title, .tm-hero-subtitle {
            color: #ffffff !important;
        }

        #3dViewer {
            width: 100%;
            height: 500px;
            border: 1px solid #ddd;
        }

        .preview-img {
            max-width: 100%;
            max-height: 100%;
            display: block;
            margin: auto;
        }

        .loader {
            border: 8px solid #f3f3f3;
            border-radius: 50%;
            border-top: 8px solid #3498db;
            width: 60px;
            height: 60px;
            animation: spin 2s linear infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #container {
            width: 90%;
            margin: 0 auto;
            padding: 5px;
            margin-top: 20px;
            height: 340px;
        }

        .photo-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .photo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 30%;
        }

        .photo-item img {
            max-width: 100px;
            max-height: 100px;
        }

        .photo-item p {
            margin-top: 5px;
            font-weight: bold;
        }

        .list-bar {
            width: 100%;
            text-align: center;
            margin-top: 5px;
        }

        .example-photo-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            width: 90%;
            margin: 0 auto;
            flex-wrap: wrap;
        }

        .example-photo-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            width: 30%;
            margin-bottom: 20px;
        }

        .example-photo-item img {
            max-width: 200px;
            max-height: 200px;
        }

        .example-photo-item p {
            margin-top: 5px;
            font-weight: bold;
        }
        
        .section-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-header h2 {
            font-size: 2.5rem;
            color: #343a40;
        }

        .section-header p {
            font-size: 1.2rem;
            color: #6c757d;
        }
        
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <section id="infinite" class="text-white tm-font-big tm-parallax">
        <nav class="navbar navbar-expand-md tm-navbar" id="tmNav">
            <div class="container" style="text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;">
                <div class="tm-next">
                    <a href="#infinite" class="navbar-brand">Wirk</a>
                </div>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <i class="fas fa-bars navbar-toggler-icon"></i>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item">
                            <a class="nav-link tm-nav-link" href="#infinite">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link tm-nav-link" href="#example">Example</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link tm-nav-link" href="#convert">Convert</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="text-center tm-hero-text-container">
            <div class="tm-hero-text-container-inner">
                <h2 class="tm-hero-title">W i r k</h2>
                <p class="tm-hero-subtitle">
                    2D 이미지를 꾸미고<br>3D로 변환해 보세요
                </p>
            </div>
        </div>

        <div class="tm-next tm-intro-next">
            <a href="#convert" class="text-center tm-down-arrow-link">
                <i class="fas fa-2x fa-arrow-down tm-down-arrow"></i>
            </a>
        </div>
    </section>

    <section id="example" class="tm-section-pad-top">
        <div class="section-header">
            <h2>변환 가능한 스타일</h2>
            <p>여러 스타일로 3D 변환해 보세요</p>
        </div>
        <div class="example-photo-container">
            <div class="example-photo-item">
                <img src="img/image1.jpg" alt="Example 1">
                <p>1</p>
            </div>
            <div class="example-photo-item">
                <img src="img/image2.jpg" alt="Example 2">
                <p>2</p>
            </div>
            <div class="example-photo-item">
                <img src="img/image3.jpg" alt="Example 3">
                <p>3</p>
            </div>
            <div class="example-photo-item">
                <img src="img/image4.jpg" alt="Example 4">
                <p>4</p>
            </div>
            <div class="example-photo-item">
                <img src="img/image5.jpg" alt="Example 5">
                <p>5</p>
            </div>
            <div class="example-photo-item">
                <img src="img/image6.jpg" alt="Example 6">
                <p>6</p>
            </div>
        </div>
    </section>

    <section id="convert" class="tm-section-pad-top d-flex align-items-center justify-content-center">
        <div id="container" class="container-fluid py-5">
            <form action="/upload" method="post" enctype="multipart/form-data" class="shadow-lg p-5 rounded bg-white mx-auto" style="max-width: 1600px;">
                <div class="row align-items-start">
                    <!-- 이미지 업로드 섹션 -->
                    <div class="col-lg-6 mb-4 mb-lg-0">
                        <div class="tm-intro-text-container p-5 border rounded bg-light shadow-sm" style="height: 100%; width: 100%;">
                            <h2 class="tm-text-primary mb-4 text-center">이미지 업로드</h2>
                            <input type="file" name="images" id="fileInput" accept="image/*" multiple class="form-control mb-3">
                            <div id="photo-container" class="photo-container">
                                <div class="photo-item mb-3" data-index="0">
                                    <img class="preview-img rounded shadow-sm" style="display: none;">
                                    <div class="list-bar mt-2 text-center">
                                        <label for="list-select-0" class="form-label">목록:</label>
                                        <select name="listSelect0" id="list-select-0" class="form-select">
                                            <option value="0">0</option>
                                            <option value="1">1</option>
                                            <option value="2">2</option>
                                            <option value="3">3</option>
                                            <option value="4">4</option>
                                            <option value="5">5</option>
                                            <option value="6">6</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="photo-item mb-3" data-index="1">
                                    <img class="preview-img rounded shadow-sm" style="display: none;">
                                    <div class="list-bar mt-2 text-center">
                                        <label for="list-select-1" class="form-label">목록:</label>
                                        <select name="listSelect1" id="list-select-1" class="form-select">
                                            <option value="0">0</option>
                                            <option value="1">1</option>
                                            <option value="2">2</option>
                                            <option value="3">3</option>
                                            <option value="4">4</option>
                                            <option value="5">5</option>
                                            <option value="6">6</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="photo-item mb-3" data-index="2">
                                    <img class="preview-img rounded shadow-sm" style="display: none;">
                                    <div class="list-bar mt-2 text-center">
                                        <label for="list-select-2" class="form-label">목록:</label>
                                        <select name="listSelect2" id="list-select-2" class="form-select">
                                            <option value="0">0</option>
                                            <option value="1">1</option>
                                            <option value="2">2</option>
                                            <option value="3">3</option>
                                            <option value="4">4</option>
                                            <option value="5">5</option>
                                            <option value="6">6</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div id="loader" class="loader"></div>
                            <button type="submit" id="upload-btn" class="btn btn-primary w-100 mt-3">업로드</button>
                        </div>
                    </div>
    
                    <!-- 3D 변환 결과 섹션 -->
                    <div class="col-lg-6">
                        <div class="tm-intro-text-container box-container p-5 border rounded bg-light shadow-sm" style="height: 100%; width: 100%;">
                            <h2 class="tm-text-primary mb-4 text-center">3D 변환 결과</h2>
                            <div id="3dViewer" class="border rounded mb-3" style="height: 400px;"></div>
                            <input type="file" id="plyFileInput" accept=".ply" class="form-control mb-3">
                            <button type="button" id="reset-btn" class="btn btn-secondary w-100 mt-3">다시하기</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </section>    

    <section id="none" class="tm-section-pad-top">
        <div id="container" class="container-fluid py-5"></div>
    </section>

    <script>
        function loadPLYFile(file) {
            var reader = new FileReader();
            reader.onload = function(event) {
                var contents = event.target.result;
                var loader = new THREE.PLYLoader();
                var geometry = loader.parse(contents);
        
                // 지오메트리 검사
                console.log(geometry);
        
                // 노멀 재계산
                geometry.computeFaceNormals();
                geometry.computeVertexNormals();
                geometry.center();
        
                var material = new THREE.MeshPhongMaterial({ color: 0x999999, shininess: 80, side: THREE.DoubleSide });
        
                var mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.rotation.reorder('YXZ');
                mesh.rotation.y = THREE.MathUtils.degToRad(-90);
        
                var scene = new THREE.Scene();
                scene.background = new THREE.Color(0xffffff);
                scene.add(mesh);
        
                var planeGeometry = new THREE.PlaneGeometry(200, 200);
                var planeMaterial = new THREE.ShadowMaterial({ opacity: 0.5 });
                var plane = new THREE.Mesh(planeGeometry, planeMaterial);
                plane.rotateX(-Math.PI / 2);
                plane.receiveShadow = true;
                scene.add(plane);
        
                var directionalLight = new THREE.DirectionalLight(0xffffff, 1);
                directionalLight.position.set(0, 5, 5);
                directionalLight.castShadow = true;
                scene.add(directionalLight);
        
                var ambientLight = new THREE.AmbientLight(0x404040);
                scene.add(ambientLight);
        
                var pointLight = new THREE.PointLight(0xffffff, 0.5);
                pointLight.position.set(0, 5, 0);
                scene.add(pointLight);
        
                var camera = new THREE.PerspectiveCamera(50, document.getElementById('3dViewer').clientWidth / 300, 0.1, 1000);
                camera.position.set(0, 5, 200); // 카메라 위치 조정
                camera.lookAt(new THREE.Vector3(0, 0, 0)); // 카메라가 바라보는 위치 설정
        
                var renderer = new THREE.WebGLRenderer();
                renderer.setSize(document.getElementById('3dViewer').clientWidth, 300);
                renderer.shadowMap.enabled = true;
        
                document.getElementById("3dViewer").innerHTML = "";
                document.getElementById("3dViewer").appendChild(renderer.domElement);
        
                var controls = new THREE.OrbitControls(camera, renderer.domElement);
        
                function animate() {
                    requestAnimationFrame(animate);
                    controls.update();
                    renderer.render(scene, camera);
                }
                animate();
            };
            reader.readAsArrayBuffer(file);
        }

        document.getElementById('fileInput').addEventListener('change', function(event) {
            const files = event.target.files;
            handleFiles(files);
        });

        document.getElementById('plyFileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file && file.name.endsWith('.ply')) {
                loadPLYFile(file);
            }
        });

        function handleFiles(files) {
            const container = document.getElementById('photo-container');

            for (let i = 0; i < 3; i++) {
                const photoItem = container.querySelector(`.photo-item[data-index="${i}"] .preview-img`);
                photoItem.src = '';
                photoItem.style.display = 'none';
            }

            for (let i = 0; i < Math.min(files.length, 3); i++) {
                const file = files[i];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const previewImg = container.querySelector(`.photo-item[data-index="${i}"] .preview-img`);
                    previewImg.src = e.target.result;
                    previewImg.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        document.getElementById('reset-btn').addEventListener('click', function() {
            location.reload(); // 페이지 새로고침
        });
    </script>
</body>
</html>
